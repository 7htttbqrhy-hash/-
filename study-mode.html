<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Design History Study Mode</title>
<style>
body{background:#080808;color:#eee;font-family:Arial,"Microsoft YaHei",sans-serif;padding:40px}
.card{max-width:800px;margin:auto;background:#151515;border:1px solid #333;padding:30px;border-radius:16px}
.tag{color:#e63946}.answer{margin-top:20px;padding:20px;background:#222;border-radius:12px}
button{background:#fff;border:0;padding:10px 20px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>设计史考研背诵模式</h1>
<p class="tag">红色★★★★★ 必背</p>
<h2>问题</h2>
<p>1919年德国成立的现代设计学校，以“艺术与技术的新统一”为核心思想，是哪一设计机构？</p>
<button onclick="show()">查看关键词</button>
<div id="a" class="answer" style="display:none">包豪斯 Bauhaus<br>关键词：1919、格罗皮乌斯、现代设计教育体系</div>
</div>
<script>function show(){document.getElementById('a').style.display='block'}</script>
</body>
</html>

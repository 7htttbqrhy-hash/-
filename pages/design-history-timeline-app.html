<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Design History Timeline</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Arial,"Microsoft YaHei"}.wrap{padding:50px;overflow-x:auto}.title{font-size:38px}.sub{color:#999;margin-bottom:30px}.filters button{background:#222;color:#eee;border:1px solid #555;padding:10px 20px;border-radius:30px;cursor:pointer}.line{display:flex;gap:35px;min-width:4000px;position:relative}.line:before{content:"";position:absolute;top:140px;left:0;right:0;height:3px;background:#444}.card{width:240px;position:relative}.dot{width:22px;height:22px;border-radius:50%;margin:125px auto 20px;background:#d33}.yellow .dot{background:#d7ad20}.blue .dot{background:#2670d8}.box{background:#151515;border:1px solid #333;border-radius:18px;padding:20px;cursor:pointer;transition:.3s}.box:hover{transform:translateY(-10px)}.detail{display:none;color:#bbb;line-height:1.8;margin-top:15px}.active .detail{display:block}.hidden{display:none}</style></head><body><div class="wrap"><h1 class="title">设计史演变时间轴</h1><div class="sub">社会问题 → 设计回应 → 设计运动 → 历史影响</div><div class="filters"><button onclick="filter('all')">全部</button><button onclick="filter('red')">🔴核心</button><button onclick="filter('yellow')">🟡高频</button><button onclick="filter('blue')">🔵扩展</button></div><div class="line"><div class="card red"><div class="dot"></div><div class="box"><b>1750 工业革命</b><div class="detail">机械化生产改变制造体系，现代设计产生背景形成。</div></div></div><div class="card red"><div class="dot"></div><div class="box"><b>1851 水晶宫博览会</b><div class="detail">工业技术展示暴露产品问题，引发设计改革。</div></div></div><div class="card red"><div class="dot"></div><div class="box"><b>1880 工艺美术运动</b><div class="detail">莫里斯、拉斯金反思工业化，强调艺术与生活结合。</div></div></div><div class="card yellow"><div class="dot"></div><div class="box"><b>1890 新艺术运动</b><div class="detail">探索新的时代形式语言。</div></div></div><div class="card yellow"><div class="dot"></div><div class="box"><b>1907 德意志制造联盟</b><div class="detail">艺术、工业、标准化结合。</div></div></div><div class="card red"><div class="dot"></div><div class="box"><b>1919 包豪斯</b><div class="detail">建立现代设计教育体系，艺术与技术统一。</div></div></div><div class="card yellow"><div class="dot"></div><div class="box"><b>1950 国际主义设计</b><div class="detail">现代主义全球传播。</div></div></div><div class="card blue"><div class="dot"></div><div class="box"><b>2000+ 数字与可持续设计</b><div class="detail">设计扩展至体验、服务和系统。</div></div></div></div></div><script>document.querySelectorAll('.box').forEach(e=>e.onclick=()=>e.classList.toggle('active'));function filter(t){document.querySelectorAll('.card').forEach(e=>e.classList.toggle('hidden',t!='all'&&!e.classList.contains(t)))}</script></body></html>

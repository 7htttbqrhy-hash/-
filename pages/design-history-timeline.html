<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Design History Timeline</title>
</head>
<body>
<main id="timeline-app">
<h1>Design History Timeline</h1>
<p>从工业革命到当代设计的演变路径</p>
<section class="timeline">
<div class="node red"><strong>1750</strong><span>工业革命：机械化生产改变设计基础</span></div>
<div class="node red"><strong>1851</strong><span>水晶宫博览会：工业与设计关系重新审视</span></div>
<div class="node red"><strong>1880</strong><span>工艺美术运动：回应工业化带来的审美危机</span></div>
<div class="node red"><strong>1907</strong><span>德意志制造联盟：工业设计体系建立</span></div>
<div class="node red"><strong>1919</strong><span>包豪斯：现代设计教育体系形成</span></div>
<div class="node yellow"><strong>1950</strong><span>国际主义设计：现代主义全球传播</span></div>
<div class="node yellow"><strong>1980</strong><span>后现代设计：多元文化转向</span></div>
<div class="node blue"><strong>2000+</strong><span>数字设计与可持续设计</span></div>
</section>
</main>
</body>
</html>
